  <text x="126" y="348" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="bold">1. Consultation file</text></g>
  <g><rect x="222" y="330" width="172" height="28" rx="5" fill="#8b5cf6" opacity="0.12" stroke="#8b5cf6" stroke-width="0.8"/>
  <text x="308" y="348" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="bold">2. Prise en charge</text></g>
  <g><rect x="404" y="330" width="172" height="28" rx="5" fill="#8b5cf6" opacity="0.12" stroke="#8b5cf6" stroke-width="0.8"/>
  <text x="490" y="348" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="bold">3. Résolution</text></g>
  <g><rect x="586" y="330" width="172" height="28" rx="5" fill="#8b5cf6" opacity="0.12" stroke="#8b5cf6" stroke-width="0.8"/>
  <text x="672" y="348" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="bold">4. Clôture ticket</text></g>
