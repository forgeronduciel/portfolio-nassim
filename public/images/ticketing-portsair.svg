  <text x="190" y="207" fill="#f59e0b" font-size="6" font-weight="bold">P3</text>
  <rect x="52" y="218" width="166" height="18" rx="4" fill="#221c3a" stroke="#6366f1" stroke-width="0.6" opacity="0.5"/>
