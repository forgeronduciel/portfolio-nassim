  <text x="604" y="180" fill="#e2e8f0" font-size="7.5">Incident diagnostiqué</text>
  <text x="590" y="196" fill="#22c55e" font-size="10">✓</text>
  <text x="604" y="196" fill="#e2e8f0" font-size="7.5">Résolution appliquée</text>
