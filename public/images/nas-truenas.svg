<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a12"/>
      <stop offset="100%" style="stop-color:#0f1f1a"/>
    </linearGradient>
    <linearGradient id="nasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="adGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="proxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="zfsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <linearGradient id="diskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a2e"/>
      <stop offset="100%" style="stop-color:#14532d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="7" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#10b981"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6366f1"/>
    </marker>
    <marker id="arrowBoth" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#10b981" opacity="0.9"/>
    </marker>
    <marker id="arrowBothStart" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#10b981" opacity="0.9"/>
    </marker>
    <marker id="arrowKerb" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowKerbStart" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="url(#bg)"/>

  <!-- Grid dots -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#10b981" opacity="0.06"/>
  </pattern>
  <rect width="900" height="400" fill="url(#dots)"/>

  <!-- ===== PROXMOX HOST (background frame) ===== -->
  <rect x="430" y="25" width="320" height="300" rx="16" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="7,4" opacity="0.35"/>
  <text x="590" y="18" text-anchor="middle" font-family="monospace" font-size="10" fill="#f59e0b" opacity="0.7">Proxmox VE — Hôte de virtualisation</text>

  <!-- ===== ACTIVE DIRECTORY ===== -->
  <g filter="url(#softglow)">
    <rect x="30" y="40" width="185" height="175" rx="14" fill="#0d1b3e" stroke="url(#adGrad)" stroke-width="2"/>
  </g>
  <!-- Server racks -->
  <rect x="65" y="58" width="115" height="13" rx="4" fill="url(#adGrad)" opacity="0.85"/>
  <rect x="65" y="75" width="115" height="13" rx="4" fill="url(#adGrad)" opacity="0.55"/>
  <rect x="65" y="92" width="115" height="13" rx="4" fill="url(#adGrad)" opacity="0.3"/>
  <circle cx="73" cy="64.5" r="3" fill="#fff" opacity="0.9"/>
  <circle cx="73" cy="81.5" r="3" fill="#86efac" opacity="0.9"/>
  <circle cx="73" cy="98.5" r="3" fill="#fbbf24" opacity="0.9"/>
  <text x="122" y="126" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#e2e8f0">Windows Server</text>
  <text x="122" y="143" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#818cf8">Active Directory</text>
  <text x="122" y="159" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#475569">AFR.LOCAL</text>
  <text x="122" y="173" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#6366f1">192.168.30.x</text>
  <text x="122" y="188" text-anchor="middle" font-family="monospace" font-size="8" fill="#475569">svc-nas@AFR.LOCAL</text>
  <text x="122" y="202" text-anchor="middle" font-family="monospace" font-size="8" fill="#475569">2 × contrôleurs de domaine</text>

  <!-- ===== TRUENAS VM (inside Proxmox) ===== -->
  <g filter="url(#softglow)">
    <rect x="448" y="42" width="285" height="165" rx="14" fill="#071a10" stroke="url(#nasGrad)" stroke-width="2.5"/>
  </g>
  <!-- NAS icon - server with drives -->
  <rect x="510" y="58" width="160" height="12" rx="3" fill="#10b981" opacity="0.8"/>
  <rect x="510" y="74" width="160" height="12" rx="3" fill="#10b981" opacity="0.55"/>
  <rect x="510" y="90" width="160" height="12" rx="3" fill="#10b981" opacity="0.35"/>
  <circle cx="518" cy="64" r="3" fill="#34d399" opacity="0.9"/>
  <circle cx="518" cy="80" r="3" fill="#34d399" opacity="0.9"/>
  <circle cx="518" cy="96" r="3" fill="#fbbf24" opacity="0.7"/>
  <!-- Drive LEDs -->
  <rect x="655" y="60" width="6" height="8" rx="1" fill="#34d399" opacity="0.8"/>
  <rect x="655" y="76" width="6" height="8" rx="1" fill="#34d399" opacity="0.8"/>
  <rect x="655" y="92" width="6" height="8" rx="1" fill="#fbbf24" opacity="0.6"/>

  <text x="590" y="122" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#e2e8f0">TrueNAS SCALE</text>
  <text x="590" y="139" text-anchor="middle" font-family="monospace" font-size="9" fill="#34d399">VM — VMID 105 · 6 Go RAM · 3 cores</text>
  <text x="590" y="155" text-anchor="middle" font-family="monospace" font-size="9" fill="#10b981">192.168.30.x (VLAN Serveurs)</text>
  <text x="590" y="171" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#475569">\\\\NAS-AFR\\DATA (SMB)</text>
  <text x="590" y="187" text-anchor="middle" font-family="monospace" font-size="8" fill="#475569">Kerberos · svc-nas@AFR.LOCAL</text>

  <!-- ===== ZFS POOL ===== -->
  <g filter="url(#glow)">
    <rect x="448" y="222" width="285" height="90" rx="12" fill="#061510" stroke="url(#nasGrad)" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>
  <text x="590" y="241" text-anchor="middle" font-family="monospace" font-size="9" fill="#34d399" font-weight="700">ZFS POOL — POOL_AFR</text>
  <!-- RAID-1 disks -->
  <rect x="468" y="250" width="110" height="50" rx="8" fill="url(#diskGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
  <text x="523" y="267" text-anchor="middle" font-family="monospace" font-size="8" fill="#34d399">💾 Disk 1 — 100 GiB</text>
  <text x="523" y="282" text-anchor="middle" font-family="monospace" font-size="8" fill="#94a3b8">RAID-1 Mirror</text>
  <text x="523" y="295" text-anchor="middle" font-family="monospace" font-size="8" fill="#475569">Dataset: DATA</text>
  <rect x="603" y="250" width="110" height="50" rx="8" fill="url(#diskGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
  <text x="658" y="267" text-anchor="middle" font-family="monospace" font-size="8" fill="#34d399">💾 Disk 2 — 100 GiB</text>
  <text x="658" y="282" text-anchor="middle" font-family="monospace" font-size="8" fill="#94a3b8">Réplication</text>
  <text x="658" y="295" text-anchor="middle" font-family="monospace" font-size="8" fill="#475569">ACL NFSv4</text>
  <!-- Mirror arrows between disks -->
  <line x1="580" y1="275" x2="601" y2="275" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowGreen)" opacity="0.7"/>
  <line x1="601" y1="279" x2="580" y2="279" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowGreen)" opacity="0.7"/>

  <!-- ===== WINDOWS CLIENTS ===== -->
  <g filter="url(#glow)">
    <rect x="30" y="255" width="185" height="120" rx="14" fill="#0d1b0d" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>
  <text x="122" y="275" text-anchor="middle" font-family="monospace" font-size="9" fill="#34d399" font-weight="700">POSTES WINDOWS</text>
  <!-- PC icons -->
  <text x="70" y="305" text-anchor="middle" font-size="22">🖥</text>
  <text x="122" y="305" text-anchor="middle" font-size="22">🖥</text>
  <text x="174" y="305" text-anchor="middle" font-size="22">🖥</text>
  <text x="70" y="320" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#475569">Utilisateur</text>
  <text x="122" y="320" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#475569">Admin</text>
  <text x="174" y="320" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#475569">Operator</text>
  <text x="122" y="342" text-anchor="middle" font-family="monospace" font-size="8" fill="#94a3b8">Membres du domaine AFR.LOCAL</text>
  <text x="122" y="357" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">192.168.10.x (VLAN Clients)</text>
  <text x="122" y="371" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#059669">Ctrl Total (Admins) · Modifier (Users)</text>

  <!-- ===== CONNECTIONS ===== -->

  <!-- AD ↔ TrueNAS (Kerberos join) — main connection -->
  <line x1="215" y1="130" x2="446" y2="130" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrowKerb)" marker-start="url(#arrowKerbStart)" filter="url(#glow)" opacity="0.9"/>
  <rect x="270" y="113" width="140" height="22" rx="7" fill="#1a1035" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.5"/>
  <text x="340" y="128" text-anchor="middle" font-family="monospace" font-size="9" fill="#c4b5fd" font-weight="700">Kerberos · Jonction domaine</text>

  <!-- TrueNAS → ZFS (internal) -->
  <line x1="590" y1="207" x2="590" y2="220" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" opacity="0.8"/>

  <!-- AD → Clients (auth) -->
  <line x1="122" y1="215" x2="122" y2="253" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowBlue)" opacity="0.7"/>
  <text x="95" y="238" font-family="monospace" font-size="7.5" fill="#818cf8">Auth AD</text>

  <!-- Clients → TrueNAS (SMB) -->
  <path d="M215,315 Q330,315 448,275" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" opacity="0.8" filter="url(#glow)"/>
  <rect x="270" y="290" width="100" height="20" rx="6" fill="#071a10" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
  <text x="320" y="304" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#34d399" font-weight="600">SMB · Port 445</text>

  <!-- Title -->
  <text x="450" y="393" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#374151" letter-spacing="2">NAS TRUENAS SCALE — INTÉGRATION ACTIVE DIRECTORY · AFR.LOCAL</text>
</svg>
