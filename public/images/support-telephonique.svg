<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff08" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#13131f"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="mailGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4ba0"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="mailGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a7340"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="resolvedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="600" height="320" fill="url(#bgGrad)"/>
  <rect width="600" height="320" fill="url(#grid)"/>

  <!-- Titre -->
  <text x="300" y="28" text-anchor="middle" fill="#94a3b8" font-size="10" letter-spacing="2">SUPPORT TÉLÉPHONIQUE · KEREIS · 2024-2025</text>

  <!-- ─── BLOC 1 : Utilisatrice ─── -->
  <rect x="28" y="50" width="130" height="90" rx="10" fill="#1e1e30" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Icône téléphone -->
  <circle cx="93" cy="75" r="18" fill="url(#phoneGrad)" opacity="0.9"/>
  <!-- Téléphone SVG icon simplifié -->
  <path d="M86 69 Q86 67 88 67 L90 67 Q92 67 92 69 L92 71 Q92 73 90 73 L89 73 Q91 78 96 80 L96 79 Q96 77 98 77 L100 77 Q102 77 102 79 L102 81 Q102 83 100 83 Q93 83 87 76 Q83 70 86 69 Z" fill="white" opacity="0.95" transform="scale(0.85) translate(14, 7)"/>
  <text x="93" y="103" text-anchor="middle" fill="#f97316" font-size="9.5" font-weight="bold">Mme DUPONT</text>
  <text x="93" y="116" text-anchor="middle" fill="#64748b" font-size="8.5">Utilisatrice</text>
  <text x="93" y="129" text-anchor="middle" fill="#64748b" font-size="8">Kereis · Pôle Assurance</text>

  <!-- ─── Appel téléphonique ─── -->
  <!-- Flèche aller -->
  <line x1="160" y1="90" x2="225" y2="90" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="225,86 235,90 225,94" fill="#f97316"/>
  <!-- Flèche retour -->
  <line x1="225" y1="103" x2="160" y2="103" stroke="#f97316" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <polygon points="160,99 150,103 160,107" fill="#f97316" opacity="0.5"/>
  <!-- Label -->
  <rect x="163" y="78" width="60" height="14" rx="4" fill="#f97316" fill-opacity="0.12"/>
  <text x="193" y="88" text-anchor="middle" fill="#f97316" font-size="8" font-weight="bold">Appel 09h22</text>
  <text x="193" y="109" text-anchor="middle" fill="#64748b" font-size="7.5">Guidage MDP</text>

  <!-- ─── BLOC 2 : Technicien ─── -->
  <rect x="238" y="50" width="130" height="90" rx="10" fill="#1e1e30" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="303" cy="75" r="18" fill="url(#techGrad)" opacity="0.9"/>
  <!-- Monitor icon -->
  <rect x="293" y="67" width="20" height="13" rx="2" fill="none" stroke="white" stroke-width="1.5"/>
  <rect x="299" y="80" width="8" height="2" rx="1" fill="white" opacity="0.8"/>
  <rect x="297" y="82" width="12" height="1.5" rx="0.75" fill="white" opacity="0.6"/>
  <text x="303" y="103" text-anchor="middle" fill="#3b82f6" font-size="9.5" font-weight="bold">Nassim ABIARI</text>
  <text x="303" y="116" text-anchor="middle" fill="#64748b" font-size="8.5">Alternant IT</text>
  <text x="303" y="129" text-anchor="middle" fill="#64748b" font-size="8">Support N1 · BTS SIO</text>

  <!-- ─── Résolution (appel) ─── -->
  <rect x="238" y="152" width="130" height="34" rx="8" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1" stroke-opacity="0.4"/>
  <text x="303" y="167" text-anchor="middle" fill="#4ade80" font-size="8.5" font-weight="bold">✓ Session rétablie à 09h38</text>
  <text x="303" y="179" text-anchor="middle" fill="#64748b" font-size="7.5">16 min · guidage pas à pas</text>

  <!-- ─── SECTION EMAILS ─── -->
  <text x="300" y="210" text-anchor="middle" fill="#94a3b8" font-size="9" letter-spacing="1.5">SUIVI PAR E-MAIL</text>
  <line x1="60" y1="213" x2="220" y2="213" stroke="#334155" stroke-width="0.8"/>
  <line x1="380" y1="213" x2="540" y2="213" stroke="#334155" stroke-width="0.8"/>

  <!-- Email 1 : Tech → Client -->
  <rect x="28" y="222" width="255" height="76" rx="9" fill="#1a2540" stroke="#1a4ba0" stroke-width="1.5"/>
  <rect x="28" y="222" width="255" height="22" rx="9" fill="url(#mailGrad1)" opacity="0.85"/>
  <rect x="28" y="236" width="255" height="8" rx="0" fill="url(#mailGrad1)" opacity="0.85"/>
  <text x="43" y="236" fill="white" font-size="8.5" font-weight="bold">✉  Tech → Mme DUPONT · 09h45</text>
  <text x="43" y="255" fill="#93c5fd" font-size="8" font-weight="bold">Objet :</text>
  <text x="80" y="255" fill="#cbd5e1" font-size="8">Suivi appel – Réinitialisation MDP</text>
  <text x="43" y="268" fill="#64748b" font-size="7.5">Confirmation résolution · conseils sécurité</text>
  <text x="43" y="280" fill="#64748b" font-size="7.5">MDP expiré · procédure de changement</text>
  <text x="43" y="292" fill="#64748b" font-size="7.5">recommandée tous les 90 jours</text>

  <!-- Flèche entre les 2 emails -->
  <line x1="295" y1="260" x2="315" y2="260" stroke="#334155" stroke-width="1"/>
  <polygon points="313,256 323,260 313,264" fill="#334155"/>

  <!-- Email 2 : Client → Tech -->
  <rect x="320" y="222" width="255" height="76" rx="9" fill="#1a2e20" stroke="#1a7340" stroke-width="1.5"/>
  <rect x="320" y="222" width="255" height="22" rx="9" fill="url(#mailGrad2)" opacity="0.85"/>
  <rect x="320" y="236" width="255" height="8" rx="0" fill="url(#mailGrad2)" opacity="0.85"/>
  <text x="335" y="236" fill="white" font-size="8.5" font-weight="bold">✉  Mme DUPONT → Tech · 10h12</text>
  <text x="335" y="255" fill="#86efac" font-size="8" font-weight="bold">Objet :</text>
  <text x="368" y="255" fill="#cbd5e1" font-size="8">Re: Suivi appel – Réinitialisation MDP</text>
  <text x="335" y="268" fill="#64748b" font-size="7.5">Confirmation · tout fonctionne parfaitement</text>
  <text x="335" y="280" fill="#4ade80" font-size="7.5">✓ Outlook · Teams · Logiciel métier OK</text>
  <text x="335" y="292" fill="#64748b" font-size="7.5">Remerciements · incident clôturé</text>
</svg>
